name: "HA AI Companion"
version: "1.24.1"
slug: "ha-ai-companion"
description: "AI-powered Home Assistant companion — manage config, dashboards, automations and memory via natural language"
url: "https://github.com/krystiankolota/ha-ai-companion"
arch:
  - aarch64
  - i386
  - amd64
  - armhf
  - armv7

# Startup configuration
init: false
startup: application
boot: auto
watchdog: "tcp://[HOST]:[PORT:8099]"

# Ingress configuration (provides security and authentication)
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-outline
panel_title: "AI Companion"

# Volume mappings - CRITICAL for config access
map:
  - type: homeassistant_config
    read_only: false
  - type: addon_config
    read_only: false
  - type: backup
    read_only: false

# API access
homeassistant_api: true
hassio_api: true
hassio_role: manager
auth_api: true

# Security
apparmor: true
privileged: []

# User-configurable options
options:
  # ── Model (OpenRouter recommended: one key, provider cost + caching) ──
  openai_api_url: "https://openrouter.ai/api/v1"
  openai_api_key: ""
  openai_model: "z-ai/glm-5.3-flash"
  # Optional cheaper model for side tasks (suggestions, summaries, memory). Blank = main.
  fast_model: ""
  # ── Behaviour ──
  log_level: "info"
  temperature: ""
  reasoning_effort: ""
  enable_cache_control: false
  max_iterations: 0
  usage_tracking: "stream_options"
  # ── Suggestions feature ──
  suggestion_prompt: ""
  # ── Node-RED ──
  nodered_url: ""
  nodered_token: ""
  nodered_flows_file: ""
  artificial_analysis_api_key: ""
  # ── Advanced ──
  system_prompt_file: ""

schema:
  openai_api_url: url
  openai_api_key: password?
  openai_model: str
  fast_model: str?
  log_level: list(debug|info|warning|error)
  temperature: str?
  reasoning_effort: str?
  enable_cache_control: bool
  max_iterations: int?
  usage_tracking: list(stream_options|usage|disabled)
  suggestion_prompt: str?
  nodered_url: str?
  nodered_token: str?
  nodered_flows_file: str?
  artificial_analysis_api_key: password?
  system_prompt_file: str?
